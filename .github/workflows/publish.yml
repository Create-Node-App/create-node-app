name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-pr:
    name: Create Release Pull Request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    needs: release-pr
    # NOTE: the changesets/action step does not reliably emit
    # hasChangesets=false (empty/unset on version-PR merges), so testing
    # for != 'true' instead: run publish unless open changesets exist.
    # The job body is a safe no-op (`changeset publish` exits cleanly)
    # when there is nothing new to release. See #314.
    if: needs.release-pr.outputs.hasChangesets != 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write # Required for OIDC trusted publishing
      contents: write # Required to push git tags for downstream workflows
      packages: write
      actions: write # Required to dispatch post-publish distribution workflows
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Full history + existing tags so `changeset tag` can skip
          # versions that are already tagged remotely.
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install npm with trusted publishing support
        # Pin to the exact npm version declared in the root packageManager
        # field (packageManager: npm@11.13.0) so the workflow and local
        # tooling stay in lockstep.
        run: npm install -g npm@11.13.0

      - name: Install dependencies
        run: npm ci

      - name: Check whether the CLI version is already published
        id: cli-release
        run: |
          version=$(node -p "require('./packages/create-awesome-node-app/package.json').version")
          if published=$(npm view "create-awesome-node-app@${version}" version 2>/dev/null) && [ "$published" = "$version" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish packages
        run: |
          # Handle both direct pushes (no changesets → no-op) and
          # Release PR merges (version bumps already committed).
          # See #313: `changeset version` exits 1 when no changesets.
          has_changesets=false
          for f in .changeset/*.md; do
            if [ -e "$f" ] && [ "${f##*/}" != "README.md" ]; then
              has_changesets=true
              break
            fi
          done
          if $has_changesets; then
            npm run publish-packages
          else
            echo "No unreleased changesets found, checking for new versions to publish"
            # dist/ is gitignored, so a bare `changeset publish` would ship
            # tarballs without build output (see the empty 0.17.0). Always
            # build first. Changesets exits successfully when there are no
            # unpublished packages; preserve real registry failures so this
            # workflow cannot report a rejected release as successful.
            npm run build
            npx changeset publish
          fi

      # Our Changesets config has "commit": false, which also disables
      # automatic tagging. Explicitly run `changeset tag` to create
      # local git tags matching every version present in the workspace
      # (e.g. create-awesome-node-app@0.12.0). It is a no-op for
      # versions already tagged in the fetched history.
      - name: Create git tags for published versions
        run: npx changeset tag

      # GITHUB_TOKEN-generated tag pushes do not trigger other workflows.
      # Dispatch the distribution jobs explicitly after a genuinely new CLI
      # version has been published. workflow_dispatch is allowed with this token.
      - name: Push git tags
        run: git push origin --tags

      - name: Dispatch distribution workflows
        if: steps.cli-release.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.cli-release.outputs.version }}
        run: |
          gh workflow run "Publish Docker image" --ref main -f "version=$VERSION"
          gh workflow run "Publish to AUR" --ref main -f "version=$VERSION"
          gh workflow run "Notify Homebrew tap" --ref main -f "version=$VERSION"
